name: Rust and Tauri checks

on:
  push:
    branches: [master, "feat/**", "fix/**"]
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check desktop JavaScript syntax
        run: node --check src/app.js
      - name: Check mobile JavaScript syntax
        run: node --check src-tauri/src/mobile.js
      - name: Check WebTransport probe JavaScript syntax
        run: node scripts/check-webtransport-probe.cjs
      - name: Check WebTransport browser client syntax
        run: node --input-type=module --check < docs/aetherdrop-webtransport.js
      - name: Test SHA-256 browser implementation
        run: node scripts/test-sha256.cjs
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev patchelf libwebkit2gtk-4.1-dev
      - name: Format Rust sources before tests
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all
      - name: Run Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Compile Rust application
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Run Clippy
        run: cargo clippy --all-targets --manifest-path src-tauri/Cargo.toml
      - name: Save formatted Rust source and resolved Cargo lockfile for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aetherdrop-ci-generated
          path: |
            src-tauri/src/lib.rs
            src-tauri/Cargo.lock
          if-no-files-found: error
          retention-days: 1
