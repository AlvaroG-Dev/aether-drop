name: Deploy WebTransport browser probe

on:
  push:
    branches: [feat/security-and-transfer-visuals]
    paths:
      - "docs/webtransport-probe.html"
      - ".github/workflows/webtransport-probe-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload probe page
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy probe page
        id: deployment
        uses: actions/deploy-pages@v4
